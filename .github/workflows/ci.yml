name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Unit tests
        run: npm test
      - name: Production build
        run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Ephemeral service container with host-auth trust: no credentials are
      # defined anywhere in this job. PUBSECGIS_SECRET_KEY is a throwaway
      # signing key for the test run only.
      PUBSECGIS_DATABASE_URL: postgresql+asyncpg://pusecgis@localhost:5432/pusecgis_test
      PUBSECGIS_SECRET_KEY: pytest-throwaway-signing-key
    services:
      postgis:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: pusecgis
          POSTGRES_DB: pusecgis_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pusecgis -d pusecgis_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Apply migrations
        run: |
          psql -h localhost -U pusecgis -d pusecgis_test -v ON_ERROR_STOP=1 \
            -f ../database/migrations/001_initial_schema.sql
          psql -h localhost -U pusecgis -d pusecgis_test -v ON_ERROR_STOP=1 \
            -f ../database/migrations/002_floorplans.sql
      - name: Tests
        run: python -m pytest tests -v
